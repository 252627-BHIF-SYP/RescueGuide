services:
    # PostgreSQL Database
    db:
        image: postgres:15-alpine
        container_name: RescueGuide-DB
        restart: unless-stopped
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: RescueGuideDB
        ports:
            - "5432:5432"
        volumes:
            - db_data:/var/lib/postgresql/data
        networks:
            - rescueguide-network

    # ASP.NET Core Backend API
    backend:
        image: ghcr.io/252627-bhif-syp/rescueguide-backend:latest
        container_name: RescueGuide-Backend
        depends_on:
            - db
        environment:
            ASPNETCORE_ENVIRONMENT: Production
            ASPNETCORE_URLS: http://+:80
            ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=RescueGuideDB;Username=postgres;Password=postgres
            Turn__SharedSecret: ${TURN_SHARED_SECRET:?Set TURN_SHARED_SECRET in infra/docker/.env}
            Turn__Urls__0: turn:192.168.6.10:3478?transport=udp
            Turn__Urls__1: turn:192.168.6.10:3478?transport=tcp
        ports:
            - "5001:80"
        restart: unless-stopped
        networks:
            - rescueguide-network

    # WebRTC Signaling Server
    signaling-server:
        image: ghcr.io/252627-bhif-syp/rescueguide-signaling:latest
        container_name: rescue-signaling
        ports:
            - "3000:3000"
        restart: unless-stopped
        networks:
            - rescueguide-network
        environment:
            NODE_ENV: production

    # VPN-only TURN relay for WebRTC media
    turn-server:
        image: coturn/coturn:4.6.3
        container_name: rescueguide-turn
        network_mode: host
        restart: unless-stopped
        volumes:
            - ../coturn/turn.conf:/etc/coturn/turn.conf:ro
        command:
            - -c
            - /etc/coturn/turn.conf
            - --static-auth-secret=${TURN_SHARED_SECRET:?Set TURN_SHARED_SECRET in infra/docker/.env}
            - --no-cli
            - --log-file=stdout

    # Client App Frontend
    client-app:
        image: ghcr.io/252627-bhif-syp/rescueguide-client:latest
        container_name: rescue-client
        ports:
            - "80:80"
        depends_on:
            - backend
            - signaling-server
        restart: unless-stopped
        networks:
            - rescueguide-network
        environment:
            NGINX_HOST: localhost
            NGINX_PORT: 80

    # Control Center Frontend
    control-center:
        image: ghcr.io/252627-bhif-syp/rescueguide-controlcenter:latest
        container_name: rescue-control
        ports:
            - "81:80"
        depends_on:
            - backend
            - signaling-server
        restart: unless-stopped
        networks:
            - rescueguide-network
        environment:
            NGINX_HOST: localhost
            NGINX_PORT: 80

volumes:
    db_data:
        driver: local

networks:
    rescueguide-network:
        external: true
        name: rescueguide_default
