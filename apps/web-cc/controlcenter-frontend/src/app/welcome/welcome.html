<div class="welcome-wrapper">
  <mat-card class="welcome-card" appearance="outlined">
    <mat-card-header>
      <div class="brand-header">
        <mat-icon class="brand-icon">security</mat-icon>
        <h2>Willkommen bei RescueGuide</h2>
        <br>
        <p>Leitstellen-Portal</p>
      </div>
    </mat-card-header>

    <mat-card-content>
      <div class="welcome-actions">
        <button mat-flat-button color="primary" routerLink="/login" class="action-btn">
          <mat-icon>login</mat-icon>
          Anmelden
        </button>

        <button mat-outlined-button routerLink="/signup" class="action-btn signup-btn">
          <mat-icon>person_add</mat-icon>
          Registrieren
        </button>
      </div>
    </mat-card-content>
  </mat-card>
</div>
