<div class="welcome-wrapper">
  <mat-card class="welcome-card" appearance="outlined">
    <mat-card-header>
      <div class="brand-header">
        <img src="assets/logo.png" alt="RescueGuide+" class="brand-logo-img">
        <h2>RescueGuide</h2>
        <p class="brand-subtitle">Leitstellen-Portal • Control Center</p>
      </div>
    </mat-card-header>

    <mat-card-content>
      <div class="welcome-actions">
        <button mat-flat-button color="primary" routerLink="/login" class="action-btn">
          <mat-icon>login</mat-icon>
          Anmelden
        </button>

        <button mat-outlined-button routerLink="/signup" class="action-btn signup-btn">
          <mat-icon>person_add</mat-icon>
          Registrieren
        </button>
      </div>
    </mat-card-content>
  </mat-card>
</div>
