<div class="video-call">

  <div *ngIf="incomingFrom && !activeCallId" class="incoming">
    <p>Eingehender Notruf-Stream von {{ incomingFrom }}</p>
    <button mat-raised-button color="primary" (click)="acceptCall()">Annehmen</button>
    <button mat-stroked-button color="warn" (click)="rejectCall()">Ablehnen</button>
  </div>

  <div #videoWrapper class="video-wrapper" [style.display]="activeCallId ? 'flex' : 'none'">

    <div class="feed-overlay" *ngIf="activeCallId">
      <span class="live-badge">LIVE</span>
      <span class="feed-status">{{ activeCallId }}</span>
    </div>

    <!-- Fullscreen Button -->
    <button
      *ngIf="activeCallId"
      class="fullscreen-btn"
      (click)="toggleVideoFullscreen()"
      aria-label="Video Vollbild"
      title="Vollbild">
      <mat-icon>fullscreen</mat-icon>
    </button>

    <video #remoteVideo autoplay playsinline muted class="remote-feed"></video>
  </div>



</div>
