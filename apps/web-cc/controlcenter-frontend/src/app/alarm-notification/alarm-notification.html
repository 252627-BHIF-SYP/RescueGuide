@if (activeAlarm()) {
  <div class="alarm-overlay">
    <div class="alarm-card">
      <div class="alarm-header">
        <div class="alarm-badge">
          <img src="assets/logo.png" alt="RescueGuide+" class="alarm-logo" />
          <span class="alarm-badge-tag">PRIO 1 • NOTRUF</span>
        </div>
        <h2>Eingehender Einsatz</h2>
      </div>

      <div class="alarm-content">
        <div class="data-row">
          <span class="label">Einsatzart:</span>
          <span class="value"
            ><strong>{{ activeAlarm()?.type }}</strong></span
          >
        </div>
        <hr />
        <div class="data-row">
          <span class="label">Standort:</span>
          <span class="value">{{ activeAlarm()?.location }}</span>
        </div>
        <div class="data-row">
          <span class="label">Anrufer:</span>
          <span class="value">{{ activeAlarm()?.caller }}</span>
        </div>
      </div>

      <div class="alarm-actions">
        <button class="btn-accept" (click)="onAccept()">Einsatz annehmen</button>
        <button class="btn-reject" (click)="onReject()">Ablehnen</button>
      </div>
    </div>
  </div>
}
